name: Compare NowGG bootstrap API

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/compare-nowgg-api.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Compare direct and proxied bootstrap
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/payload.json <<'JSON'
          {
            "appId":"19900",
            "uaId":"ua-test-xbox",
            "userType":"NA",
            "uaSessionId":"NA",
            "feSessionId":"xbox-test-session",
            "packageName":"com.roblox.client",
            "originTimestamp":"2026-09-20T01:00:00.000Z",
            "eventName":"ApBootstrap",
            "extraData":{"rawPageUrl":"test","workflowCategory":"workflow1","unifiedEnabled":"true","enablePlayPage":"false"},
            "feDeviceType":"desktop",
            "feOsName":"Linux",
            "utmSource":"NA",
            "utmMedium":"NA",
            "utmCampaign":"NA",
            "ngReferrer":"NA",
            "pageReferrer":"NA",
            "ngEntryPoint":"NA",
            "visitId":"test",
            "ntmSource":"NA",
            "feSessionTags":["nowgg"],
            "userSource":"NA",
            "visitSource":"others",
            "userCampaign":"NA",
            "userAcqVar":"NA",
            "visitCampaign":"NA"
          }
          JSON

          echo "===== DIRECT COOKIE ====="
          curl -A "Mozilla/5.0" -fsSL -c /tmp/direct.cookies             'https://20.ip.nowgg.fun/apps/a/19900/b.html' -o /dev/null
          cat /tmp/direct.cookies || true

          echo "===== DIRECT API ====="
          curl -A "Mozilla/5.0" -sS -b /tmp/direct.cookies             -H 'Content-Type: application/json'             -H 'Origin: https://20.ip.nowgg.fun'             -H 'Referer: https://20.ip.nowgg.fun/apps/a/19900/b.html'             --data-binary @/tmp/payload.json             -w '\nHTTP=%{http_code}\n'             'https://20.ip.nowgg.fun/oapi/2/play/v1/push' | head -c 6000
          echo

          echo "===== PROXY COOKIE ====="
          curl -A "Mozilla/5.0" -fsSL -c /tmp/proxy.cookies             'https://xbox-xi-gold.vercel.app/nowgg-ip/20/apps/a/19900/b.html' -o /dev/null
          cat /tmp/proxy.cookies || true

          echo "===== PROXY API ====="
          curl -A "Mozilla/5.0" -sS -b /tmp/proxy.cookies             -H 'Content-Type: application/json'             --data-binary @/tmp/payload.json             -w '\nHTTP=%{http_code}\n'             'https://xbox-xi-gold.vercel.app/nowgg-ip/20/oapi/2/play/v1/push' | head -c 6000
          echo
