name: Compare NowGG direct vs proxy

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/compare-nowgg-browser.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare rendered Roblox pages
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "chrome=$CHROME"

          dump() {
            local url="$1"
            local out="$2"
            timeout 22s "$CHROME"               --headless=new               --no-sandbox               --disable-dev-shm-usage               --disable-background-networking               --autoplay-policy=no-user-gesture-required               --use-fake-ui-for-media-stream               --virtual-time-budget=9000               --dump-dom "$url" > "$out" 2>/tmp/chrome.err || true
            echo "URL=$url bytes=$(wc -c < "$out")"
            python3 - "$out" <<'PY'
          import re,sys
          text=open(sys.argv[1],errors='ignore').read()
          plain=re.sub(r'<[^>]+>',' ',text)
          plain=re.sub(r'\s+',' ',plain)
          for phrase in ['does not exist','game not found','invalid game','unavailable','Roblox','Play now']:
              print(phrase, phrase.lower() in plain.lower())
          for m in re.finditer(r'(?i).{0,140}(?:does not exist|game not found|invalid game|unavailable).{0,180}',plain):
              print('ERROR_CONTEXT:',m.group(0))
          PY
          }

          echo "===== DIRECT ====="
          dump 'https://20.ip.nowgg.fun/apps/a/19900/b.html' /tmp/direct.html

          echo "===== PROXY ====="
          dump 'https://xbox-xi-gold.vercel.app/nowgg-ip/20/apps/a/19900/b.html' /tmp/proxy.html

          echo "===== PROXY COOKIE HEADERS ====="
          curl -sS -D - -o /dev/null --max-time 20             'https://xbox-xi-gold.vercel.app/nowgg-ip/20/apps/a/19900/b.html'             | grep -Ei '^(HTTP/|set-cookie:|x-nowgg-proxy:)' || true
