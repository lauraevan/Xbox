name: Inspect nowgg.fun relay game errors

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/inspect-nowgg-errors.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect root and relay output
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re, urllib.request, urllib.parse

          paths = [
            '/apps/a/19900/b.html',
            '/apps/a/10011/b.html',
            '/apps/a/10008/b.html',
            '/apps/robtop-games/1400/geometry-dash.html',
            '/apps/psyonix-studios/4656/rocket-league.html',
            '/apps/playducky/7199/melon-sandbox.html',
            '/apps/a/10019/b.html',
            '/apps/uncube/7074/now.html',
            '/apps/aptoide/5874/aptoide.html',
          ]

          headers={'User-Agent':'Mozilla/5.0'}
          prefixes=[20,40,52,104]

          for path in paths:
              print('\n==============================')
              print('PATH', path)
              print('==============================')

              root='https://nowgg.fun'+path
              try:
                  req=urllib.request.Request(root,headers=headers)
                  html=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
                  print('ROOT bytes',len(html))
                  for m in re.finditer(r'(?i)(game[^<\n]{0,120}(?:exist|found|invalid)|does not exist|not found|app[^<\n]{0,120}(?:exist|found|invalid))',html):
                      print('ROOT MATCH',m.group(0)[:500])
              except Exception as e:
                  print('ROOT ERROR',repr(e))

              for prefix in prefixes:
                  url=f'https://{prefix}.ip.nowgg.fun{path}'
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      resp=urllib.request.urlopen(req,timeout=20)
                      body=resp.read().decode('utf-8','ignore')
                      print('RELAY',prefix,'status',resp.status,'bytes',len(body),'final',resp.geturl())
                      bad=[]
                      for pattern in [
                          r'(?i)game[^<\n]{0,160}(?:does not exist|not found|invalid|unavailable)',
                          r'(?i)(?:does not exist|game not found|invalid game|app not found|not available)',
                          r'(?i)<title>[^<]+</title>'
                      ]:
                          for m in re.finditer(pattern,body):
                              bad.append(m.group(0)[:500])
                      if bad:
                          print('  MATCHES',bad[:12])
                      # Print iframe/script URLs likely containing real game target
                      refs=set()
                      for x in re.findall(r'https?://[^"\x27\s<>]+',body):
                          if any(k in x.lower() for k in ['now','game','app','cloud','play','rtc','ws']):
                              refs.add(x[:1000])
                      for x in list(refs)[:20]:
                          print('  URL',x)
                  except Exception as e:
                      print('RELAY',prefix,'ERROR',repr(e))
          PY
