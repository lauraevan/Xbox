name: Inspect nowgg.fun game runtime

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/inspect-nowgg-runtime.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect launcher logic
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request

          url='https://nowgg.fun/apps/a/19900/b.html'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
          lines=html.splitlines()

          needles=[
            'RTCPeerConnection','createElement("iframe")',"createElement('iframe')",
            '.src =','src =','appendChild','getIPs','getQueryParam','fetch(',
            'window.location','document.location','iframe'
          ]

          for needle in needles:
              print('\n===== NEEDLE', needle, '=====')
              for i,line in enumerate(lines):
                  if needle in line:
                      start=max(0,i-18); end=min(len(lines),i+34)
                      for n in range(start,end):
                          print(f'{n+1:04d}: {lines[n]}')
                      print('---')
          PY
