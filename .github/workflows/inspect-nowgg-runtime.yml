name: Inspect nowgg.fun game runtime

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/inspect-nowgg-runtime.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public game pages
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse

          urls = [
            'https://nowgg.fun/apps/a/19900/b.html',
            'https://nowgg.fun/apps/robtop-games/1400/geometry-dash.html',
            'https://nowgg.fun/apps/a/10011/b.html',
            'https://nowgg.fun/apps/a/10008/b.html',
          ]
          headers = {'User-Agent':'Mozilla/5.0'}

          for url in urls:
              print('\n===== PAGE', url, '=====')
              req = urllib.request.Request(url, headers=headers)
              html = urllib.request.urlopen(req, timeout=20).read().decode('utf-8','ignore')
              print('bytes', len(html))

              print('--- URLs / refs ---')
              seen = set()
              for m in re.findall(r'(?:src|href|action|poster)=["\x27]([^"\x27]+)', html, re.I):
                  full = urllib.parse.urljoin(url, m)
                  if full not in seen:
                      seen.add(full)
                      print(full)

              print('--- Runtime keywords ---')
              for line in html.splitlines():
                  if re.search(r'webrtc|RTCPeerConnection|websocket|WebSocket|wss://|ws://|iframe|fetch\(|XMLHttpRequest|postMessage|nowgg|now\.gg|api|signal|rtc|turn|stun', line, re.I):
                      print(line[:2400])

              scripts = re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)', html, re.I)
              for src in scripts:
                  surl = urllib.parse.urljoin(url, src)
                  if urllib.parse.urlparse(surl).hostname != 'nowgg.fun':
                      continue
                  try:
                      req = urllib.request.Request(surl, headers=headers)
                      js = urllib.request.urlopen(req, timeout=20).read().decode('utf-8','ignore')
                  except Exception as exc:
                      print('SCRIPT ERROR', surl, exc)
                      continue
                  print('--- SCRIPT', surl, 'bytes', len(js), '---')
                  for line in js.splitlines():
                      if re.search(r'webrtc|RTCPeerConnection|websocket|WebSocket|wss://|ws://|iframe|fetch\(|XMLHttpRequest|postMessage|nowgg|now\.gg|api|signal|rtc|turn|stun', line, re.I):
                          print(line[:3000])
          PY
