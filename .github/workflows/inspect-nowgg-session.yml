name: Inspect nowgg.fun session headers

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/inspect-nowgg-session.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect session headers
        shell: bash
        run: |
          set -euo pipefail
          for url in             'https://nowgg.fun/apps/a/19900/b.html'             'https://20.ip.nowgg.fun/apps/a/19900/b.html'; do
            echo "===== $url ====="
            curl -A "Mozilla/5.0" -sS -D - -o /dev/null --max-time 20 "$url"               | grep -Ei '^(HTTP/|set-cookie:|location:|vary:|server:|content-security-policy:|cross-origin|permissions-policy:)' || true
          done
