name: Inspect nowgg.fun app metadata

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/inspect-nowgg.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch nowgg.fun public client files
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess, urllib.parse, urllib.request

          headers = {'User-Agent':'Mozilla/5.0'}
          req = urllib.request.Request('https://nowgg.fun/', headers=headers)
          html = urllib.request.urlopen(req, timeout=20).read().decode('utf-8','ignore')

          print('===== HTML references =====')
          for kind, value in re.findall(r'(src|href)=["\x27]([^"\x27]+)', html, re.I)[:120]:
              print(kind, value)

          print('===== App-ish HTML =====')
          for line in html.splitlines():
              if re.search(r'app|game|roblox|among|geometry|fnaf|poppy|worldbox|bloons|singing', line, re.I):
                  print(line[:1200])

          scripts = re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)', html, re.I)
          print('===== Scripts =====')
          for src in scripts[:30]:
              url = urllib.parse.urljoin('https://nowgg.fun/', src)
              print(url)
              try:
                  req = urllib.request.Request(url, headers=headers)
                  text = urllib.request.urlopen(req, timeout=20).read().decode('utf-8','ignore')
              except Exception as exc:
                  print('ERROR', exc)
                  continue
              print('===== Matches in', url, '=====')
              count = 0
              for line in text.splitlines():
                  if re.search(r'pre-picked|app|game|roblox|among|geometry|fnaf|poppy|worldbox|bloons|singing|nowgg', line, re.I):
                      print(line[:1800])
                      count += 1
                      if count >= 80:
                          break
          PY
