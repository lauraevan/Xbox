name: Vendor NowGG Steam artwork

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/vendor-nowgg-art.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/xbox-web-replica-v4s0jk

      - name: Download SteamDB-mapped artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/nowgg

          fetch_art() {
            local appid="$1"
            local out="$2"
            local base="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/$appid"

            if ! curl -A "Mozilla/5.0" -fL --retry 3 --connect-timeout 10               "$base/library_600x900.jpg" -o "$out"; then
              curl -A "Mozilla/5.0" -fL --retry 3 --connect-timeout 10                 "$base/header.jpg" -o "$out"
            fi

            test -s "$out"
          }

          # These IDs are mapped from the matching SteamDB app records.
          fetch_art 1677740 assets/nowgg/stumble-guys.jpg
          fetch_art 1938090 assets/nowgg/call-of-duty.jpg
          fetch_art 322170  assets/nowgg/geometry-dash.jpg
          fetch_art 252950  assets/nowgg/rocket-league.jpg

      - name: Commit vendored artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nowgg
          if git diff --cached --quiet; then
            echo "Artwork already vendored."
            exit 0
          fi
          git commit -m "Vendor visible NowGG game artwork"
          git push origin HEAD:claude/xbox-web-replica-v4s0jk
