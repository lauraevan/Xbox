name: Verify live black canvas

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/verify-live-black.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production alias
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 https://xbox-xi-gold.vercel.app/ -o /tmp/index.html
          grep -Fq 'css/final-home-fixes.css?v=blackfix-20260919-1' /tmp/index.html
          grep -Fq 'js/reference.js?v=guide-logo-blackfix-20260919-1' /tmp/index.html
          curl -fsSL --max-time 20 https://xbox-xi-gold.vercel.app/css/final-home-fixes.css -o /tmp/fix.css
          grep -Fq 'body[data-view="home"][data-home-neutral="true"] #stage' /tmp/fix.css
          grep -Fq 'background:#000 !important' /tmp/fix.css
          echo LIVE_BLACK_AND_GUIDE_FIX_OK
