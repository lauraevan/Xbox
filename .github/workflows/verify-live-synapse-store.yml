name: Verify live Synapse Store

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/verify-live-synapse-store.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production alias
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://xbox-xi-gold.vercel.app'
          curl -fsSL --max-time 20 "$BASE/" -o /tmp/index.html
          grep -Fq 'css/final-home-fixes.css?v=synapse-store-labels-20260919-1' /tmp/index.html
          grep -Fq 'data-label="Synapse Store"' /tmp/index.html
          curl -fsSL --max-time 20 "$BASE/js/reference.js?v=synapse-store-labels-20260919-1" -o /tmp/reference.js
          grep -Fq "label:'Synapse Store'" /tmp/reference.js
          curl -fsSL --max-time 20 "$BASE/css/final-home-fixes.css?v=synapse-store-labels-20260919-1" -o /tmp/fix.css
          grep -Fq 'content:attr(data-label)' /tmp/fix.css
          grep -Fq '.synapse-store-name' /tmp/fix.css
          echo LIVE_SYNAPSE_STORE_OK
