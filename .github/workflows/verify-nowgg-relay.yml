name: Verify nowgg.fun relay

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/verify-nowgg-relay.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify catalogue and IP relay
        shell: bash
        run: |
          set -euo pipefail

          echo "===== CATALOG ====="
          curl -fsSL --max-time 20             https://xbox-xi-gold.vercel.app/assets/nowgg/catalog.json             -o /tmp/catalog.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/catalog.json'))
          print('count=',len(data))
          print([g['name'] for g in data])
          assert len(data) == 11
          assert any(g['name']=='Roblox' for g in data)
          PY

          echo "===== ROOT LAUNCHER REWRITE ====="
          curl -fsSL --max-time 25             https://xbox-xi-gold.vercel.app/nowgg/apps/a/19900/b.html             -o /tmp/root.html
          grep -Fq '/nowgg-ip/' /tmp/root.html
          grep -Fq 'RTCPeerConnection' /tmp/root.html
          echo "root launcher rewrite present"

          echo "===== RELAY ====="
          for prefix in 20 40 52 104; do
            code=$(curl -sS -L --max-time 25 -o /tmp/relay.html -w '%{http_code}'               "https://xbox-xi-gold.vercel.app/nowgg-ip/$prefix/apps/a/19900/b.html" || true)
            echo "prefix=$prefix status=$code bytes=$(wc -c < /tmp/relay.html 2>/dev/null || echo 0)"
            if [ "$code" = "200" ] && [ -s /tmp/relay.html ]; then
              if ! grep -q 'FUNCTION_INVOCATION_FAILED' /tmp/relay.html; then
                echo "working relay prefix=$prefix"
                head -c 400 /tmp/relay.html
                echo
                exit 0
              fi
            fi
          done
          echo "No relay prefix returned a usable response"
          exit 1
