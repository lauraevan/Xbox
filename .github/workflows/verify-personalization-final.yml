name: Verify personalization final

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Syntax check browser scripts
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Production build
        run: npm run build
      - name: Verify personalization files
        run: |
          test -f dist/js/personalization.js
          test -f dist/js/wallpaper-system.js
          test -f dist/css/personalization.css
          grep -q 'js/app.js?v=personalize-20260920-3' dist/index.html
          grep -q 'js/personalization.js?v=personalize-20260920-3' dist/index.html
          grep -q 'css/personalization.css?v=personalize-20260920-3' dist/index.html
