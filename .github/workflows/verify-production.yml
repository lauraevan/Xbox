name: Verify production Xbox deployment

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/verify-production.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production alias
        shell: bash
        run: |
          set -euo pipefail

          echo "===== STATIC NOWGG CATALOG ====="
          curl -fsSL --max-time 20             https://xbox-xi-gold.vercel.app/assets/nowgg/catalog.json             -o /tmp/catalog.json
          cat /tmp/catalog.json
          grep -q '"Stumble Guys"' /tmp/catalog.json
          grep -q '"Geometry Dash"' /tmp/catalog.json
          grep -q '"Rocket League"' /tmp/catalog.json

          echo
          echo "===== LOCAL ART ====="
          curl -fsSIL --max-time 20             https://xbox-xi-gold.vercel.app/assets/nowgg/stumble-guys.jpg             | sed -n '1,25p'

          echo
          echo "===== NOWGG.FUN PROXY GAME ====="
          curl -sSL --max-time 25 -o /tmp/game.html -D /tmp/game.headers             https://xbox-xi-gold.vercel.app/nowgg/apps/robtop-games/1400/geometry-dash.html
          cat /tmp/game.headers
          test -s /tmp/game.html
          if grep -q 'FUNCTION_INVOCATION_FAILED' /tmp/game.html; then
            echo "Proxy function still failed"
            exit 1
          fi
          echo "Proxy body bytes: $(wc -c < /tmp/game.html)"
