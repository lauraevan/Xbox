name: Verify live Stratus runtime

on:
  push:
    branches:
      - claude/xbox-web-replica-v4s0jk
    paths:
      - .github/workflows/verify-stratus-merge.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production runtime version
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20             https://xbox-xi-gold.vercel.app/             -o /tmp/index.html
          grep -Fq 'js/stratus.js?v=nowgg-20260919-3' /tmp/index.html
          grep -Fq 'js/stratus-backend-pass.js?v=nowgg-20260919-3' /tmp/index.html
          echo "live cache-busted Stratus runtime present"
