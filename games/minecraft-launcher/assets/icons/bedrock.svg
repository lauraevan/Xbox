  <rect x="30" y="24" width="10" height="8" fill="#8A6647"/>
  <rect x="50" y="30" width="8" height="8" fill="#6B4E36"/>
  <rect x="16" y="40" width="8" height="8" fill="#8A6647"/>
  <rect x="42" y="46" width="10" height="8" fill="#6B4E36"/>
  <rect x="4" y="50" width="8" height="8" fill="#8A6647"/>
