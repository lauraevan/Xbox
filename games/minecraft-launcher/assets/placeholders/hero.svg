<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa3e0"/><stop offset="1" stop-color="#9fd0f0"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="380" fill="url(#sky)"/>
  <!-- pixel clouds -->
  <g fill="#ffffff" opacity=".85">
    <rect x="120" y="70" width="120" height="26"/><rect x="150" y="52" width="70" height="18"/>
    <rect x="720" y="54" width="150" height="28"/><rect x="760" y="36" width="80" height="18"/>
    <rect x="470" y="96" width="90" height="20"/>
  </g>
  <!-- distant hills -->
  <g fill="#5b9b4a" opacity=".55">
    <rect x="0" y="210" width="1040" height="40"/>
    <rect x="80" y="188" width="220" height="24"/><rect x="560" y="182" width="260" height="30"/>
  </g>
  <!-- grass ground blocks -->
  <g>
    <rect x="0" y="250" width="1040" height="130" fill="#6a4a30"/>
    <rect x="0" y="250" width="1040" height="30" fill="#5aa62f"/>
    <rect x="0" y="272" width="1040" height="10" fill="#4c8f26"/>
  </g>
  <g fill="#7cbb38">
    <rect x="0" y="250" width="52" height="14"/><rect x="130" y="250" width="52" height="14"/>
    <rect x="260" y="250" width="52" height="14"/><rect x="390" y="250" width="52" height="14"/>
    <rect x="520" y="250" width="52" height="14"/><rect x="650" y="250" width="52" height="14"/>
    <rect x="780" y="250" width="52" height="14"/><rect x="910" y="250" width="52" height="14"/>
  </g>
  <!-- dirt pixels -->
  <g fill="#5e4028" opacity=".7">
    <rect x="40" y="300" width="40" height="40"/><rect x="240" y="330" width="40" height="40"/>
    <rect x="470" y="300" width="40" height="40"/><rect x="700" y="332" width="40" height="40"/>
    <rect x="900" y="304" width="40" height="40"/>
  </g>
  <!-- sun -->
  <rect x="900" y="40" width="60" height="60" fill="#fff4c2"/>
  <!-- placeholder label -->
  <g font-family="'Press Start 2P','Courier New',monospace">
    <text x="520" y="170" text-anchor="middle" font-size="30" fill="#ffffff" opacity=".92" style="letter-spacing:2px">HERO IMAGE</text>
    <text x="520" y="204" text-anchor="middle" font-size="13" fill="#ffffff" opacity=".7">PLACEHOLDER · replace in /assets/placeholders/hero.svg</text>
  </g>
</svg>
