<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<title>Xbox</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-theme="dark">

<!-- colour-blindness correction matrices, applied to the whole stage -->
<svg class="filter-defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="cvd-protanopia" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="0.567 0.433 0     0 0
                                           0.558 0.442 0     0 0
                                           0     0.242 0.758 0 0
                                           0     0     0     1 0"/>
    </filter>
    <filter id="cvd-deuteranopia" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="0.625 0.375 0     0 0
                                           0.7   0.3   0     0 0
                                           0     0.3   0.7   0 0
                                           0     0     0     1 0"/>
    </filter>
    <filter id="cvd-tritanopia" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="0.95  0.05  0     0 0
                                           0     0.433 0.567 0 0
                                           0     0.475 0.525 0 0
                                           0     0     0     1 0"/>
    </filter>
  </defs>
</svg>

<!-- ══════════════════ BOOT ══════════════════ -->
<div id="boot" class="boot">
  <video id="bootVideo" class="boot-video"
         muted playsinline preload="auto" disablepictureinpicture
         poster="assets/boot-poster.jpg">
    <source src="assets/boot.webm" type="video/webm">
    <source src="assets/boot.mp4" type="video/mp4">
  </video>
</div>

<!-- ══════════════════ STAGE ══════════════════ -->
<div id="stage" class="stage" hidden>

  <!-- dynamic background -->
  <div class="backdrop">
    <div class="backdrop-layer" id="bgA"></div>
    <div class="backdrop-layer" id="bgB"></div>
    <div class="backdrop-scrim"></div>
    <div class="backdrop-glow"></div>
  </div>

  <!-- a dedicated scrim so the bar keeps its weight whatever art is behind -->
  <div class="topbar-scrim" aria-hidden="true"></div>

  <!-- ─────────── system bar ───────────
       Nav sits centred on the top line with status opposite it; the
       profile block sits on its own line underneath, as on the console. -->
  <header class="sysbar" id="sysbar">
    <div class="sysbar-top">
      <nav class="sysnav" id="sysnav">
        <button class="sysnav-btn" data-nav data-group="sysbar" data-view="home"
                data-icon="column_triple" title="Recent &amp; pins" aria-label="Recent and pins"></button>
        <button class="sysnav-btn" data-nav data-group="sysbar" data-view="library"
                data-icon="library" title="My games &amp; apps" aria-label="My games and apps"></button>
        <button class="sysnav-btn" data-nav data-group="sysbar" data-view="pass"
                title="Game Pass" aria-label="Game Pass">
          <span class="gp-chip">GAME<br>PASS</span>
        </button>
        <button class="sysnav-btn" data-nav data-group="sysbar" data-view="search"
                data-icon="search" title="Search" aria-label="Search"></button>
        <button class="sysnav-btn" data-nav data-group="sysbar" data-view="settings"
                data-icon="settings" title="Settings" aria-label="Settings">
          <span class="badge-dot" id="settingsDot"></span>
        </button>
      </nav>

      <div class="sysstatus">
        <button class="friends" data-nav data-group="sysbar" data-act="friends" aria-label="Friends online">
          <span class="friends-icon" data-icon="people"></span>
          <span class="friends-count" id="friendsCount">0</span>
        </button>
        <button class="status-btn" id="micBtn" data-nav data-group="sysbar" data-act="mic"
                aria-label="Microphone"></button>
        <span class="battery" aria-label="Controller battery">
          <span class="battery-shell"><span class="battery-fill" id="batteryFill"></span></span>
          <span class="battery-cap"></span>
        </span>
        <span class="clock" id="clock">--:--</span>
      </div>
    </div>

    <button class="profile" data-nav data-group="sysbar" data-act="profile">
      <span class="avatar"><img id="avatarImg" alt=""></span>
      <span class="profile-text">
        <span class="gamertag" id="gamertagLabel">NewSasquatch</span>
        <span class="profile-sub" id="profileSub">signed in</span>
      </span>
    </button>
  </header>

  <!-- ─────────── views ─────────── -->
  <main class="views" id="views">
    <section class="view view-home" id="view-home"></section>
    <section class="view view-library" id="view-library" hidden></section>
    <section class="view view-pass" id="view-pass" hidden></section>
    <section class="view view-search" id="view-search" hidden></section>
    <section class="view view-settings" id="view-settings" hidden></section>
  </main>

  <!-- ─────────── button legend ─────────── -->
  <footer class="legend" id="legend"></footer>
</div>

<!-- ══════════════════ GAME DETAIL ══════════════════ -->
<div class="detail" id="detail" hidden></div>

<!-- ══════════════════ LAUNCH / PLAY ══════════════════ -->
<div class="launch" id="launch" hidden>
  <div class="launch-art" id="launchArt"></div>
  <div class="launch-center">
    <div class="launch-spinner"><span></span><span></span><span></span><span></span></div>
    <div class="launch-title" id="launchTitle"></div>
    <div class="launch-sub">Starting game…</div>
  </div>
</div>
<div class="player" id="player" hidden>
  <iframe id="playerFrame" title="Game" allow="autoplay; fullscreen; gamepad; pointer-lock; cross-origin-isolated"
          sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms allow-modals"></iframe>
  <div class="player-hint" id="playerHint">Press <kbd>Esc</kbd> for the guide</div>
</div>

<!-- ══════════════════ GUIDE ══════════════════ -->
<aside class="guide" id="guide" hidden>
  <div class="guide-scrim" data-guide-close></div>
  <div class="guide-panel">
    <nav class="guide-rail" id="guideRail"></nav>
    <div class="guide-body" id="guideBody"></div>
  </div>
</aside>

<!-- ══════════════════ OVERLAYS ══════════════════ -->
<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden></div>
<div class="scanline" id="scanline" hidden></div>
<div class="night-veil" id="nightVeil" hidden></div>

<script src="js/icons.js"></script>
<script src="js/media.js"></script>
<script src="js/features.js"></script>
<script src="js/catalog.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/nav.js"></script>
<script src="js/views.js"></script>
<script src="js/guide.js"></script>
<script src="js/app.js"></script>
</body>
</html>
