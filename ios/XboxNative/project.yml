name: XboxNative
options:
  bundleIdPrefix: com.evaninc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.evaninc.xboxnative
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  XboxNative:
    type: application
    platform: iOS
    sources:
      - path: Sources/XboxNative
        excludes:
          - Resources
    resources:
      - path: Sources/XboxNative/Resources
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Xbox
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
